let L=(navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en';try{L=localStorage.getItem('kz-lang')||L;}catch(e){}
function lang(l){L=l;document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));}

const SALT='ZW5JoSImMYzgfLpb7lRuZg==',IV='F6kJjcQ28jx5JBoV',B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:B(SALT),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){const ct=B(document.getElementById('ct').textContent.trim());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(IV)},key,ct);
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{try{const raw=localStorage.getItem('kz-gate');if(raw){const key=await crypto.subtle.importKey('raw',B(raw),{name:'AES-GCM'},false,['decrypt']);await open(key);}}catch(e){try{localStorage.removeItem('kz-gate');}catch(x){}}})();
