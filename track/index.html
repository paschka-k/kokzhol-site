document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>lang(b.dataset.lang)));lang(L==='ru'?'ru':'en');
const SALT='ZW5JoSImMYzgfLpb7lRuZg==',IV='v+tRMyJu8IINcY7A',B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:B(SALT),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){const ct=B(document.getElementById('ct').textContent.trim());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(IV)},key,ct);
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{try{const raw=localStorage.getItem('kz-gate');if(raw){const key=await crypto.subtle.importKey('raw',B(raw),{name:'AES-GCM'},false,['decrypt']);await open(key);}}catch(e){try{localStorage.removeItem('kz-gate');}catch(x){}}})();
document.getElementById('gate').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),err=document.getElementById('err');b.disabled=true;b.textContent=T[L].busy;err.removeAttribute('data-show');
 try{const key=await keyFrom(document.getElementById('pw').value);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));try{localStorage.setItem('kz-gate',btoa(String.fromCharCode(...raw)));}catch(x){}await open(key);}
 catch(x){err.setAttribute('data-show','');b.disabled=false;b.textContent=T[L].btn;document.getElementById('pw').select();}});
</script>
